name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Spec 1715 (FR-19, Q-123): the live Softy e2e sends real requests to a Softy tenant,
  # so it runs only on this weekly schedule and on a manual dispatch (or when the
  # EVER_JOBS_LIVE_SOFTY repository variable is 1) — never on a push or pull request.
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

# A new push to a pull request cancels that PR's run still in progress: one PR
# run takes ~11 runners, and superseded runs were being cancelled by hand.
# Every other event (a push to develop / main, the schedule, a manual dispatch)
# gets a group of its own run id, so it is never cancelled — nor queued: GitHub
# keeps one pending run per group and cancels an older pending one, so a group
# shared by every push to a branch (`github.ref`) would still drop a push that
# lands while two runs are ahead of it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-lint:
    name: Docs Lint
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      - name: Run docs-lint
        run: npm run lint:docs

      # The whole directory, not just docs-lint: the spec-ranges allocator and the
      # probe/scaffold/assemble helpers live here too and ran in no job at all.
      - name: Run scripts unit tests
        run: npm run test:scripts

  build:
    name: Build & Type-Check
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      - name: Type-check
        run: npx tsc --project apps/api/tsconfig.build.json --noEmit

      # Specs are no longer type-checked at test time (swc transpiles only) —
      # this keeps the coverage, earlier in the pipeline.
      - name: Type-check sources and specs
        run: npx tsc --project tsconfig.typecheck.json --noEmit

      - name: Build API
        run: npx nest build

      - name: Verify dist output
        run: |
          test -f dist/apps/api/main.js || { echo "main.js not found in dist"; exit 1; }
          echo "dist output verified"

      - name: Build CLI
        run: npx nest build cli

  test-fast:
    name: Test (Health & Smoke)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      - name: Run health endpoint tests
        run: npx jest --testPathPatterns 'apps/api/__tests__/health' --verbose

  # Hermetic core suites (Spec 1689): packages/{common,plugin,models,analytics},
  # apps/api/src, apps/api/__tests__/{jobs,integration}, apps/mcp and the
  # apps/cli unit specs (crawl-options, Spec 1690; the CLI e2e spec stays in
  # test-e2e). None of them ran in any job before — `test-fast` covers only
  # the apps/api health spec and `test-e2e` the live search/analyze/CLI specs
  # — so two apps/api suites sat red unnoticed (a stale JobsService stub, and
  # a Gem call count from before Spec 5035). BLOCKING: no continue-on-error.
  #
  # The path list lives in the `test:core` npm script so a local
  # `npm run test:core` and this job cannot drift. `*.e2e-spec.ts` is excluded,
  # and every suite in the set was run with outbound sockets blocked and opened
  # none. The worker count is a repo variable sized to the runner's cgroup CPU
  # limit — never a `%`, which jest resolves against the HOST's CPUs.
  test-core:
    name: Test (Core)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      - name: Run core unit & hermetic integration tests
        run: npm run test:core -- --maxWorkers=${{ vars.JEST_CORE_MAX_WORKERS || '3' }} --verbose --reporters=default --reporters=github-actions

  test-e2e:
    name: Test (E2E - Live APIs)
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_8 != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      - name: Run API search & analyze E2E tests
        run: npx jest --testPathPatterns 'apps/api/__tests__/(search|analyze)' --verbose
        continue-on-error: true

      - name: Run CLI E2E tests
        run: npx jest --testPathPatterns 'apps/cli/__tests__' --verbose
        continue-on-error: true

  # Source-plugin tests split by kind: `test-sources` runs the ~1,600 mocked
  # unit suites in 3 parallelized shards; `test-source-e2e` runs the ~250 live
  # `*.e2e-spec.ts` suites in 6 serial shards (jest.config.js globals
  # maxWorkers:1 / testTimeout:120s exist for them — live-network flakes now
  # red only the e2e legs, never the unit legs).
  #
  # Why sharded at all: the corpus outgrew a single job. Unsharded, it ran past
  # GitHub's 360-minute ceiling (killed mid-flight after 1,221 suites, so the
  # rest never ran and the job could never report). The 180 min per-shard
  # ceiling is from observation, not estimate: identical shards took 1h23m-1h43m
  # on a quiet pool but 2h+ on a busy one, and a 120 min ceiling cancelled the
  # contended legs — killing the suites it exists to run.
  #
  # Unit-shard sizing (Spec 1689): our self-hosted ARC runners are
  # cgroup-limited (6 CPU on the x64-8 pool) while jest sizes a `%` against the
  # HOST's CPUs, so `--maxWorkers=75%` meant up to ~27 workers throttled onto 6
  # CPUs with 30 s per-test timeouts. Both knobs are repo variables instead:
  #   JEST_SOURCE_UNIT_MAX_WORKERS — worker count per shard (default 5, one
  #     under the 6-CPU limit);
  #   RUNNER_SOURCE_UNIT — runner for the unit shards, so they can move pools
  #     without a workflow edit (default: RUNNER_LINUX_X64_8, then ubuntu-latest).
  test-sources:
    name: Test (Source Scrapers unit ${{ matrix.shard }}/3)
    runs-on: ${{ vars.RUNNER_SOURCE_UNIT || vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    needs: build
    continue-on-error: true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ (vars.RUNNER_SOURCE_UNIT || vars.RUNNER_LINUX_X64_8) != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      - name: Run source scraper unit tests
        run: npx jest --testPathPatterns 'packages/plugins/source-' --testPathIgnorePatterns 'e2e-spec' --shard=${{ matrix.shard }}/3 --maxWorkers=${{ vars.JEST_SOURCE_UNIT_MAX_WORKERS || '5' }} --testTimeout=30000 --passWithNoTests --verbose --reporters=default --reporters=github-actions

  test-source-e2e:
    name: Test (Source Scrapers e2e ${{ matrix.shard }}/6)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    needs: build
    continue-on-error: true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      # Spec 1715 (FR-19, audit G26/G30): the live Softy e2e is gated on
      # EVER_JOBS_LIVE_SOFTY=1 — set on schedule / workflow_dispatch (or through the
      # EVER_JOBS_LIVE_SOFTY repository variable). Otherwise the spec skips its live
      # tests with a visible reason; this notice says so in the run summary.
      - name: Live Softy e2e gate
        if: ${{ matrix.shard == 1 }}
        env:
          EVER_JOBS_LIVE_SOFTY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || vars.EVER_JOBS_LIVE_SOFTY || '0' }}
        run: |
          if [ "$EVER_JOBS_LIVE_SOFTY" = "1" ]; then
            echo "::notice title=Live Softy e2e::runs this time (EVER_JOBS_LIVE_SOFTY=1, event ${{ github.event_name }})"
          else
            echo "::notice title=Live Softy e2e skipped::EVER_JOBS_LIVE_SOFTY is not 1 on a ${{ github.event_name }} run; it runs on the weekly schedule, on workflow_dispatch, or with the EVER_JOBS_LIVE_SOFTY repository variable (Spec 1715)"
          fi

      - name: Run source scraper e2e tests
        run: npx jest --testPathPatterns 'source-.*e2e-spec' --shard=${{ matrix.shard }}/6 --passWithNoTests --verbose --reporters=default --reporters=github-actions
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EVER_JOBS_LIVE_SOFTY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || vars.EVER_JOBS_LIVE_SOFTY || '0' }}

  test-feature-plugins:
    name: Test (Feature Plugins)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Registry
        uses: ever-co/ever-gauzy/.github/actions/configure-registry@b8dfc31a33078b1ffa3660517bf90565b6bb1842
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: |
          # node-gyp gets the headers setup-node already installed, so a native
          # module with no prebuilt binary (better-sqlite3) compiles offline. The
          # headers download from nodejs.org times out from the ARC runners and
          # was failing whole jobs (Spec 1689).
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci

      # Hermetic offline suites (no live APIs) — these gate the build.
      # Perf budgets are relaxed for shared-runner variance via the suites'
      # documented env overrides (Spec 722 / FR-9, D-5): local defaults stay
      # strict (250 ms / 2 500 ms); CI ceilings still catch the 24x-over
      # class of regression these gates exist for.
      #
      # Two DIFFERENT budgets, deliberately:
      #   DEDUP_PERF_NFR1_MS  — dedup-perf.spec.ts, the authoritative gate. Builds
      #     the batch once and takes the max over 5 WARMED runs (20-40 ms observed
      #     here), so it stays tight.
      #   DEDUP_COLD_NFR1_MS  — the single unwarmed run in dedup-hybrid.service.spec.ts,
      #     which includes JIT compilation of the whole pipeline. Observed at
      #     1 251 ms and 1 451 ms on this runner, so a 1 000 ms ceiling failed a
      #     gating job on warm-up rather than on a regression. 4 000 ms leaves ~2.7x
      #     headroom over the worst observation while still catching a gross
      #     regression. Sharing one knob would force the real gate loose.
      #   DEDUP_LOOP_MAX_STALL_MS — dedup-event-loop.spec.ts, the worst gap between
      #     two event-loop turns while dedup() runs a 2 500-job batch (local default
      #     250 ms; ~18 ms observed locally). On a loaded runner one slice measured
      #     339 ms and failed a gating run (PR #101 attempt 1), while the same tree
      #     minus two unrelated files passed. 1 000 ms leaves ~2.9x headroom over
      #     that and stays 15x under the 15 s liveness-probe timeout the gate
      #     protects. The regression it exists for (no cooperative yields) is still
      #     caught twice over: its gap is the whole pass (1 331 ms locally, longer
      #     on a runner), and the spec's `ticks > 10` assertion reads 0 whatever
      #     this budget is.
      # legitimacy-detector (pure, hermetic) joined in Spec 1689 — it ran in no
      # job before, although corpus-signals uses it for real.
      # store-sqlite-drizzle and store-postgres-prisma (Spec 1722): the batched write
      # path, the conformance suite and the module wiring. Hermetic: SQLite runs
      # in-process on :memory: (better-sqlite3 compiles against the headers above)
      # and the Postgres suite uses a structural fake client; its real-database
      # block stays gated on RUN_PG_TESTS=1. They ran in no job before.
      # career-level-classifier (Spec 1730): the fixture precision / recall thresholds, the
      # misclassification regression gate and the cost tripwires. Its throughput gate is a
      # ratio against a same-process reference workload, so it needs no runner override.
      # Its API wiring (the careerLevels filter through the production ValidationPipe on
      # REST and GraphQL, aggregator, resolver, NDJSON) is hermetic and lives under
      # apps/api/src and apps/api/__tests__/integration, so Test (Core) runs it.
      - name: Run feature plugin tests
        run: npx jest --testPathPatterns 'packages/plugins/(dedup-hybrid|merge-default|store-memory|store-sqlite-drizzle|store-postgres-prisma|liveness-http|legitimacy-detector|career-level-classifier)/' --verbose
        env:
          DEDUP_PERF_NFR1_MS: '1000'
          DEDUP_PERF_NFR2_MS: '8000'
          DEDUP_COLD_NFR1_MS: '4000'
          DEDUP_LOOP_MAX_STALL_MS: '1000'

  docker:
    name: Docker Build
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ever-jobs-api:ci .

      - name: Verify Docker health
        run: |
          docker run -d --name ever-jobs-test -p 3001:3001 ever-jobs-api:ci

          # Poll instead of a flat `sleep 10`. Bootstrap instantiates ~1,800
          # plugin modules and (at DEBUG) logs one line per source, which on a
          # slower runner takes well over 10s — the old fixed sleep raced that
          # and failed with HTTP 000 (connection refused, i.e. not listening
          # yet) rather than a real health failure. This flake gets strictly
          # worse with every plugin batch we add.
          STATUS=000
          for i in $(seq 1 45); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            [ "$STATUS" = "200" ] && break
            # Fail fast if the container died — no point polling a corpse.
            if [ "$(docker inspect -f '{{.State.Running}}' ever-jobs-test 2>/dev/null)" != "true" ]; then
              echo "Container exited during startup"
              break
            fi
            sleep 2
          done

          if [ "$STATUS" = "200" ]; then
            echo "Health check passed (HTTP $STATUS) after ~$((i * 2))s"
          else
            echo "Health check failed (HTTP $STATUS)"
            echo "--- container logs ---"
            docker logs ever-jobs-test
          fi

          docker stop ever-jobs-test >/dev/null 2>&1 || true
          docker rm ever-jobs-test >/dev/null 2>&1 || true

          [ "$STATUS" = "200" ] || exit 1
