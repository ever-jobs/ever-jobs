name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docs-lint:
    name: Docs Lint
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run docs-lint
        run: npm run lint:docs

      # The whole directory, not just docs-lint: the spec-ranges allocator and the
      # probe/scaffold/assemble helpers live here too and ran in no job at all.
      - name: Run scripts unit tests
        run: npm run test:scripts

  build:
    name: Build & Type-Check
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --project apps/api/tsconfig.build.json --noEmit

      - name: Build API
        run: npx nest build

      - name: Verify dist output
        run: |
          test -f dist/apps/api/main.js || { echo "main.js not found in dist"; exit 1; }
          echo "dist output verified"

      - name: Build CLI
        run: npx nest build cli

  test-fast:
    name: Test (Health & Smoke)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run health endpoint tests
        run: npx jest --testPathPatterns 'apps/api/__tests__/health' --verbose

  test-e2e:
    name: Test (E2E - Live APIs)
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API search & analyze E2E tests
        run: npx jest --testPathPatterns 'apps/api/__tests__/(search|analyze)' --verbose
        continue-on-error: true

      - name: Run CLI E2E tests
        run: npx jest --testPathPatterns 'apps/cli/__tests__' --verbose
        continue-on-error: true

  # Sharded because the source-plugin corpus outgrew a single job. `jest
  # --listTests` reports 1,815 suites under `packages/plugins/source-`, and at
  # roughly 17 s of wall-clock apiece that is ~8.5 h — past GitHub's 360-minute
  # job ceiling. It was NOT hanging: the last unsharded run logged PASS lines
  # continuously from 11:32 to 17:25 and was killed mid-flight having completed
  # 1,221 suites, so the remainder were never exercised and the job could never
  # report a result at all.
  #
  # Six shards put each at ~300 suites / ~1.4 h — comfortably inside the 120 min
  # ceiling below — for the same total runner time, and no single job can squat
  # a pool slot for 6 h again. Verified locally that the shards partition
  # cleanly: 303+303+303+302+302+302 = 1,815, no overlap and nothing dropped.
  test-sources:
    name: Test (Source Scrapers ${{ matrix.shard }}/6)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    needs: build
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source scraper tests
        run: npx jest --testPathPatterns 'packages/plugins/source-' --shard=${{ matrix.shard }}/6 --passWithNoTests --verbose
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

  test-feature-plugins:
    name: Test (Feature Plugins)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hermetic offline suites (no live APIs) — these gate the build.
      # Perf budgets are relaxed for shared-runner variance via the suites'
      # documented env overrides (Spec 722 / FR-9, D-5): local defaults stay
      # strict (250 ms / 2 500 ms); CI ceilings still catch the 24x-over
      # class of regression these gates exist for.
      - name: Run feature plugin tests
        run: npx jest --testPathPatterns 'packages/plugins/(dedup-hybrid|merge-default|store-memory|liveness-http)/' --verbose
        env:
          DEDUP_PERF_NFR1_MS: '1000'
          DEDUP_PERF_NFR2_MS: '8000'

  docker:
    name: Docker Build
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ever-jobs-api:ci .

      - name: Verify Docker health
        run: |
          docker run -d --name ever-jobs-test -p 3001:3001 ever-jobs-api:ci

          # Poll instead of a flat `sleep 10`. Bootstrap instantiates ~1,800
          # plugin modules and (at DEBUG) logs one line per source, which on a
          # slower runner takes well over 10s — the old fixed sleep raced that
          # and failed with HTTP 000 (connection refused, i.e. not listening
          # yet) rather than a real health failure. This flake gets strictly
          # worse with every plugin batch we add.
          STATUS=000
          for i in $(seq 1 45); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            [ "$STATUS" = "200" ] && break
            # Fail fast if the container died — no point polling a corpse.
            if [ "$(docker inspect -f '{{.State.Running}}' ever-jobs-test 2>/dev/null)" != "true" ]; then
              echo "Container exited during startup"
              break
            fi
            sleep 2
          done

          if [ "$STATUS" = "200" ]; then
            echo "Health check passed (HTTP $STATUS) after ~$((i * 2))s"
          else
            echo "Health check failed (HTTP $STATUS)"
            echo "--- container logs ---"
            docker logs ever-jobs-test
          fi

          docker stop ever-jobs-test >/dev/null 2>&1 || true
          docker rm ever-jobs-test >/dev/null 2>&1 || true

          [ "$STATUS" = "200" ] || exit 1
