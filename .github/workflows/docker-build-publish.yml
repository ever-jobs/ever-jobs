name: Build and Publish Ever Jobs Image

# Builds the Ever Jobs container (API; MCP shares the image) and pushes it to GHCR
# (ghcr.io/ever-jobs/ever-jobs) using the built-in GITHUB_TOKEN. The k8s-gauzy cluster
# pulls this image for the INTERNAL (ClusterIP-only) Ever Jobs deployment.
on:
  push:
    branches: [main, stage, develop]
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - ".deploy/**"
      - ".github/workflows/docker-build-publish.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Publishes to ghcr.io/ever-jobs/*, which only the canonical repo's
    # GITHUB_TOKEN can write to. Forks would fail the push with
    # `denied: permission_denied`, so skip the job outside this repo.
    if: ${{ github.repository == 'ever-jobs/ever-jobs' }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute env tag from branch
        id: envtag
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
            stage) echo "tag=stage" >> "$GITHUB_OUTPUT" ;;
            develop) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          # `:latest` tracks PRODUCTION only.
          # It used to be pushed from EVERY branch, so it floated to whichever
          # environment happened to build last — a dev build would silently
          # claim `:latest`. Nothing on ever-k8s consumes it (all three envs pin
          # :dev/:stage/:prod, resolved to a digest by ArgoCD Image Updater), but
          # a floating `:latest` is how mcpserver.ever.works ended up serving a
          # six-week-old dev image for weeks.
          tags: |
            ghcr.io/ever-jobs/ever-jobs:${{ steps.envtag.outputs.tag }}
            ghcr.io/ever-jobs/ever-jobs:${{ github.sha }}
            ${{ github.ref_name == 'main' && 'ghcr.io/ever-jobs/ever-jobs:latest' || '' }}
          # Warm from THIS environment's own tag, not the floating `:latest`.
          cache-from: type=registry,ref=ghcr.io/ever-jobs/ever-jobs:${{ steps.envtag.outputs.tag }}
          cache-to: type=inline

  build-mcp:
    # See the note on `build`: skip outside the canonical repo (forks can't
    # push to ghcr.io/ever-jobs/*).
    if: ${{ github.repository == 'ever-jobs/ever-jobs' }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute env tag from branch
        id: envtag
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
            stage) echo "tag=stage" >> "$GITHUB_OUTPUT" ;;
            develop) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push MCP (GHCR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.deploy/mcp/Dockerfile
          push: true
          platforms: linux/amd64
          # `:latest` tracks PRODUCTION only — see the note on the API image above.
          tags: |
            ghcr.io/ever-jobs/ever-jobs-mcp:${{ steps.envtag.outputs.tag }}
            ghcr.io/ever-jobs/ever-jobs-mcp:${{ github.sha }}
            ${{ github.ref_name == 'main' && 'ghcr.io/ever-jobs/ever-jobs-mcp:latest' || '' }}
          # Warm from THIS environment's own tag, not the floating `:latest`.
          cache-from: type=registry,ref=ghcr.io/ever-jobs/ever-jobs-mcp:${{ steps.envtag.outputs.tag }}
          cache-to: type=inline
