var COMPANY_DATA = {"name":"Covenant Industries","company_uid":"3B.00F","token":"B3F4EB959F8167E437A383B167E4EB9B3F59F8"};
var COMPANY_POSITIONS_DATA = [{"name":"Communications Software Engineer","department":"Software","email":"covenantindustries.94.F6D@comeetapply.com","location":{"name":"Grand Prairie, Texas, USA","country":"","city":null,"state":null,"postal_code":null,"street_name":null,"arrival_instructions":null,"street_number":null,"timezone":"America/Chicago","location_uid":"BB.60D","is_remote":false},"url_comeet_hosted_page":"https://www.comeet.com/jobs/covenantindustries/3B.00F/communications-software-engineer/94.F6D","url_recruit_hosted_page":"https://www.comeet.com/jobs/covenantindustries/3B.00F/communications-software-engineer/94.F6D","url_active_page":"https://www.comeet.com/jobs/covenantindustries/3B.00F/communications-software-engineer/94.F6D","employment_type":null,"experience_level":null,"uid":"94.F6D","custom_fields":{"details":[{"name":"Description","value":"<p><strong>Title: Communications Subject Matter Expert (SME) \u2013 Tactical Systems &amp; Swarm Networks&nbsp;&nbsp;</strong></p><p><strong>Location:&nbsp;Dallas, TX</strong></p><p><strong>COMPANY OVERVIEW</strong></p><p>Covenant is a global defense company headquartered in Washington, D.C., building long-range precision strike weapons for the United States and its allies. Its flagship munition, Anthem, combines heavy payload and long range at a fraction of the cost of comparable legacy systems, with production volumes designed to meet the demands of prolonged conflict. Designed as an end-to-end weapon system that is simple to store, transport, and field, Anthem is produced in the United States, Germany, and Israel. For more information, visit <a href=\"http://covenant.com/\" target=\"_blank\" rel=\"noopener noreferrer\">covenant.com</a></p><p><strong>THE ROLE</strong></p><p>As the Communications Subject Matter Expert (SME), you will lead the architecture, integration, and deployment of resilient communications systems that enable the next generation of autonomous precision strike capabilities. Sitting at the intersection of Software, Hardware, and RF Engineering, you will serve as the technical authority responsible for designing secure, reliable, and scalable tactical datalinks that support the Anthem munition system across contested operating environments.</p><p>You will own the evolution of our communications architecture from prototype to production, ensuring seamless connectivity between munitions, ground control systems, military SATCOM networks, and joint force assets. This role spans the full product lifecycle\u2014from system design and integration through live-fire testing and operational deployment\u2014with a relentless focus on delivering communications that are secure, resilient, and intuitive for the warfighter.</p><p><br></p><p><strong>\ufeffWHAT YOU'LL DO</strong></p><ul><li>Lead the design, integration, and optimization of tactical communications architectures supporting the Anthem munition system.</li><li>Develop resilient SATCOM capabilities that connect airborne assets directly with Ground Control Stations (GCS) using U.S. military communications infrastructure.</li><li>Design, implement, and validate secure communications pathways between munitions, operators, and joint force assets.</li><li>Architect resilient S-band inter-munition communications supporting autonomous mesh networking, collaborative targeting, and operations in GPS-denied and electronically contested environments.</li><li>Develop secure software and hardware interfaces for classified government communication networks and compartmented data sources.</li><li>Integrate software-defined radios (SDRs), RF subsystems, and networking protocols into production-ready hardware platforms.</li><li>Collaborate with Software, Hardware, RF, Guidance, Navigation &amp; Control (GNC), and Systems Engineering teams to deliver fully integrated communication solutions.</li><li>Support system integration, field testing, customer demonstrations, and live-fire events across multiple government programs.</li><li>Partner directly with U.S. Army, U.S. Space Force, and other Department of Defense stakeholders to ensure interoperability with evolving tactical communications architectures.</li><li>Optimize communications systems for rapid field deployment, intuitive operation, and reliable mission execution under combat conditions.</li><li>Evaluate emerging communications technologies and recommend innovative solutions that enhance survivability, resilience, and operational effectiveness.</li></ul><p><br></p><p><strong>\ufeffREQUIRED QUALIFICATIONS</strong></p><ul><li>Bachelor's degree in Electrical Engineering, Computer Engineering, Computer Science, RF Engineering, or a related technical discipline.</li><li>5+ years of experience developing communications systems within the defense, aerospace, or national security sectors.</li><li>Strong technical expertise spanning RF Engineering, Software Engineering, and embedded communications systems.</li><li>Deep understanding of S-band communications, RF propagation, waveform optimization, link budget analysis, and electronic warfare (EW) resilience.</li><li>Experience developing or integrating military or commercial SATCOM solutions on low-SWaP airborne platforms.</li><li>Expertise with software-defined radios (SDRs), tactical networking protocols, and distributed mesh networking architectures.</li><li>Experience integrating secure communications into autonomous systems ,munitions, unmanned aircraft, or other defense platforms.</li><li>Strong understanding of communication system testing, RF troubleshooting, and system integration.</li><li>Ability to collaborate across multidisciplinary engineering organizations in a fast-paced development environment.</li><li>Active Top Secret security clearance with SCI eligibility.</li><li>Ability to support compartmented programs requiring SCI access and specialized government communications environments.</li></ul><p><br></p><p><strong>\ufeffPREFERRED QUALIFICATIONS</strong></p><ul><li>Experience integrating AFATDS (Advanced Field Artillery Tactical Data System), Artillery Execution Suite (AXS), or similar digital fires systems.</li><li>Familiarity with Army sensor-to-shooter architectures, Variable Message Format (VMF), Link 16, or other tactical military communications standards.</li><li>Experience supporting autonomous weapons, precision strike systems, loitering munitions, or collaborative autonomous platforms.</li><li>Knowledge of U.S. Space Force communications architectures and military SATCOM systems.</li><li>Experience operating within highly classified Special Access Programs (SAP) or compartmented government programs.</li><li>Experience supporting developmental flight testing, operational demonstrations, or live-fire events.</li><li>Active Top Secret / SCI clearance with current access to classified DoD communication environments.</li></ul><p><br></p><p><strong><span class=\"ql-cursor\">\ufeff</span>WHAT MAKES YOU SUCCESSFUL</strong></p><ul><li>You thrive solving complex communications challenges where software, hardware, RF engineering, and mission execution intersect.</li><li>You understand that resilient communications are mission-critical and design systems that perform reliably in contested and denied environments.</li><li>You can translate advanced technical concepts into robust, production-ready capabilities that operate seamlessly in the hands of military operators.</li><li>You are equally comfortable working in a laboratory, on a test range, or alongside government customers to validate mission performance.</li><li>You are driven by delivering communication systems that enable autonomous platforms to operate with speed, resilience, and precision in the most demanding operational environmen<strong>ts.</strong></li></ul>","order":1},{"name":"Salary","value":null,"order":2},{"name":"Requirements","value":null,"order":3}],"categories":[]},"internal_use_custom_id":"","url_detected_page":null,"picture_url":null,"time_updated":"2026-09-09T1 ts. This role will partner closely with Business Development, Program Management, Finance, and Executive Leadership to ensure proposals are competitively priced, contracts are structured to minimize risk, and programs are executed in accordance with contractual obligations.</p><p>The ideal candidate has significant experience working directly on U.S. government contracts\u2014either for a defense prime, a key supplier, or within the military acquisition community\u2014and understands the full contract lifecycle from opportunity pursuit through contract closeout. This is a highly collaborative role requiring expertise in government contracting, pricing strategy, proposal development, contract negotiations, and compliance.</p><p><strong>WHAT YOU'LL DO</strong></p><ul><li>Lead the preparation, negotiation, execution, and administration of U.S. government contracts.</li><li>Partner with Business Development during capture activities to evaluate acquisition strategies, contract vehicles, and solicitation requirements.</li><li>Support proposal development by reviewing RFPs, identifying contractual risks, and developing compliant contract responses.</li><li>Work closely with Program Managers to establish program scope, pricing assumptions, execution strategies, and contractual deliverables.</li><li>Develop cost estimates and pricing strategies that align with customer requirements and company objectives.</li><li>Review and negotiate contract terms and conditions with government customers and prime contractors.</li><li>Identify contractual, financial, and execution risks while developing mitigation strategies.</li><li>Support contract modifications, change requests, funding actions, and contract closeout activities.</li><li>Coordinate with Finance to support invoicing, payment milestones, funding status, and contract financial performance.</li><li>Ensure compliance with FAR, DFARS, agency supplements, and internal company policies.</li><li>Support internal and external audits, including DCAA and other government compliance reviews.</li><li>Maintain contract documentation and provide guidance to internal stakeholders throughout the contract lifecycle.</li><li>Serve as a trusted advisor to Program Management and Leadership on contractual obligations, risk, and compliance.</li></ul><p><br></p><p><strong>\ufeffREQUIRED QUALIFICATIONS</strong></p><ul><li>Bachelor's degree in Business, Finance, Contracts, Supply Chain, Legal Studies, or a related field.</li><li>5\u201310+ years of experience managing U.S. government contracts within the defense industry.</li><li>Experience working directly with the U.S. Department of Defense as either a prime contractor or a major subcontractor.</li><li>Strong knowledge of the Federal Acquisition Regulation (FAR), Defense Federal Acquisition Regulation Supplement (DFARS), and government contracting practices.</li><li>Experience supporting the full contract lifecycle, including proposal development, contract negotiations, execution, modifications, and closeout.</li><li>Experience developing pricing strategies, cost estimates, or contract pricing for government proposals.</li><li>Experience supporting government audits, including DCAA or similar compliance reviews.</li><li>Strong analytical, negotiation, and problem-solving skills.</li><li>Ability to effectively communicate with Business Development, Program Management, Finance, Legal, and executive leadership.</li><li>Must be eligible to obtain and maintain a U.S. security clearance.</li><li>U.S. Person status required due to export control regulations.</li></ul><p><br></p><p><strong><span class=\"ql-cursor\">\ufeff</span>PREFERRED QUALIFICATIONS</strong></p><ul><li>Prior military experience, particularly within the U.S. Army or U.S. Navy acquisition or contracting community.</li><li>Experience transitioning from military acquisition or government contracting into the defense industry.</li><li>Background supporting major defense acquisition programs or complex DoD procurements.</li><li>Experience with sole-source, competitive, OTA, IDIQ, and other government contract vehicles.</li><li>Familiarity with Earned Value Management (EVM), program finance, and cost estimating.</li><li>Experience supporting both commercial and government contracting environments.</li><li>NCMA certifications (CPCM, CFCM, or equivalent) are a plus.</li><li>Experience working in a high-growth defense technology company or startup environment.</li></ul>","order":1},{"name":"Salary","value":"<p><strong>Range: 150,000 - 225,000 plus equity and benefits</strong></p>","order":2},{"name":"Requirements","value":null,"order":3}],"categories":[]},"internal_use_custom_id":"","url_detected_page":null,"picture_url":null,"time_updated":"2026-09-09T15:45:22Z","company_name":"Covenant Industries","is_internal":false,"linkedin_job_posting_id":null,"workplace_type":"On-site"}];
